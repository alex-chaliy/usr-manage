<div class="toggle-wrap">
  <span class="toggle-label">Mode</span>
  <button
    type="button"
    class="toggle-switch"
    [class.active]="toggleValue"
    [attr.aria-pressed]="toggleValue"
    (click)="onToggle()"
  >
    <span class="toggle-knob"></span>
  </button>
  <span class="toggle-state">{{ mode === 'pagination' ? 'Pagination' : 'Infinite Scroll' }}</span>
</div>
